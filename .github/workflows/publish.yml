name: Publish game

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Assemble static site
        shell: bash
        run: |
          set -euo pipefail
          # No dependencies are installed and no project code is executed.
          # If a build tool is introduced, integrate sec-helper before running it.
          mkdir _site
          cp game/index.html game/verify.html game/styles.css game/ui.css game/manifest.webmanifest game/version.json LICENSE _site/
          cp -R game/src game/assets game/variants shared _site/
          sed -i "s|../../shared/|../shared/|g" _site/src/*.mjs
          sed -i -E "s/\\.mjs(['\"])/.mjs?v=${GITHUB_SHA}\\1/g" _site/src/*.mjs _site/shared/*.mjs
          version=$(sed -n 's/.*"version":"\([^"]*\)".*/\1/p' game/version.json)
          sed -i "s/__BUILD__/${GITHUB_SHA}/g; s/__VERSION__/${version}/g" _site/index.html _site/verify.html
          printf '{"version":"%s","build":"%s"}\n' "$version" "$GITHUB_SHA" > _site/version.json
          test -z "$(find _site -type l -print -quit)"
          test -z "$(find _site -name '.*' -print -quit)"
          touch _site/.nojekyll
      - name: Upload site
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
